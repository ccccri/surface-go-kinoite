# Internal microphone: PipeWire's default puts the mic chain at +60 dB (ALSA Capture +30 dB and Mic Boost +30 dB) so even breathing
# fills the signal. Keep the physical source at a low level (set with `wpctl set-volume <source> 0.25`, WirePlumber remembers it) and
# expose a filtered virtual source (WebRTC noise suppression + high-pass) as the default microphone.
# Install to ~/.config/pipewire/pipewire.conf.d/.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.high_pass_filter  = true
        webrtc.gain_control      = false
      }
      capture.props  = { node.name = "mic_filter_capture"  node.passive = true
                         target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo" }
      source.props   = { node.name = "mic_filtered" node.description = "Built-in Microphone (filtered)"
                         media.class = Audio/Source priority.session = 2000 priority.driver = 2000 }
      sink.props     = { node.name = "mic_filter_sink" node.description = "(unused) mic filter reference"
                         priority.session = 1 priority.driver = 1 }
      playback.props = { node.name = "mic_filter_playback" node.passive = true }
    }
  }
]
