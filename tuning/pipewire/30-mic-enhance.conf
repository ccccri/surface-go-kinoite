# Microphone enhancer: a small equaliser and gain stage after the filtered microphone (20-mic-filter.conf), published as the source
# "Built-in Microphone (enhanced)" and made the default one. Surface Control > Audio changes the values live and rewrites this file.
# Install to ~/.config/pipewire/pipewire.conf.d/ (the control panel creates it when you enable the enhancer).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Microphone (enhanced)"
      media.name       = "Built-in Microphone (enhanced)"
      filter.graph = {
        nodes = [
          { type = builtin name = hp   label = bq_highpass  control = { "Freq" = 80.0 "Q" = 0.707 } }
          { type = builtin name = bass label = bq_lowshelf  control = { "Freq" = 200.0 "Q" = 0.707 "Gain" = 0.0 } }
          { type = builtin name = pres label = bq_peaking   control = { "Freq" = 3000.0 "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = treb label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.707 "Gain" = 0.0 } }
          { type = builtin name = gain label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
        ]
        links = [
          { output = "hp:Out"   input = "bass:In" }
          { output = "bass:Out" input = "pres:In" }
          { output = "pres:Out" input = "treb:In" }
          { output = "treb:Out" input = "gain:In" }
        ]
        inputs  = [ "hp:In" ]
        outputs = [ "gain:Out" ]
      }
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props  = { node.name = "mic_enhance_capture" node.passive = true target.object = "mic_filtered" }
      playback.props = { node.name = "mic_enhanced" media.class = Audio/Source priority.session = 3000 priority.driver = 3000 }
    }
  }
]
