# Surface Go speakers are very quiet: the hardware mixer is already at 0 dB at 100%, and the stock maximum (150%) was the
# only way to get usable loudness. This virtual sink applies a fixed digital gain so that the displayed 125% equals what the
# plain sink produced at 150% (the loudest level that was measured without extra distortion):
#   (1.5 / 1.25)^3 = 1.728 (PipeWire/Pulse volumes are cubic), i.e. +4.75 dB.
# Install to ~/.config/pipewire/pipewire.conf.d/. The physical sink must stay at 100%.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Speakers (boosted)"
      media.name       = "Built-in Speakers (boosted)"
      filter.graph = {
        nodes = [
          { type = builtin name = gainL label = linear control = { "Mult" = 1.728 "Add" = 0.0 } }
          { type = builtin name = gainR label = linear control = { "Mult" = 1.728 "Add" = 0.0 } }
        ]
        inputs  = [ "gainL:In" "gainR:In" ]
        outputs = [ "gainL:Out" "gainR:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "boosted_speakers"
        media.class = Audio/Sink
        priority.session = 2000
        priority.driver = 2000
      }
      playback.props = {
        node.name = "boosted_speakers_out"
        node.passive = true
        target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
      }
    }
  }
]
